<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TK 播放与收益</title><link rel="stylesheet" href="board.css"></head>
<body>
<header><div><h1>TK 播放与收益</h1><div class="status" id="status">正在读取数据…</div></div><button id="refresh">刷新</button></header>
<main>
  <div id="error" class="notice warning" role="alert"></div>
  <section><h2>昨天发布的表现</h2><p class="muted">按视频 PID 统计；播放量是截至最近采集的数值，不冒充昨天结束时的数值。</p>
    <div class="grid" id="yesterdayMetrics"></div><div class="panel" id="yesterdayVideos"></div></section>
  <section class="spaced"><h2>什么时间发更合适</h2><p class="muted">近 7 天、已经发布满 24 小时的视频，按北京时间发布时间分组；比较首日播放，不是比较观众观看的时刻。</p>
    <div class="panel" id="posting"></div><div class="panel"><details><summary>按首次采到的标签对比</summary><div id="tags"></div></details></div>
    <details><summary>这个对比怎么算</summary><p class="muted" id="postingMethod"></p></details></section>
  <section class="spaced"><h2>正在跑的单条视频</h2><p class="muted">近 7 天、各号最新 15 条中的 ≥1000 播放视频；按手机排序，按发布时间从新到旧，隐藏后仍按 PID 保留上次记录。</p><div id="live"></div></section>
  <section class="spaced"><h2>各手机累计收益</h2><p class="muted">USD · 你录入的具体金额；核对时间不同，不自动按播放量推算收益。</p><div class="grid" id="revenueMetrics"></div><div class="panel" id="rewards"></div></section>
  <section class="spaced"><details><summary>本周总结与账号对比</summary><div id="week"></div></details></section>
  <details><summary>采集状态</summary><div class="panel" id="health"></div></details>
</main><script src="public.js"></script>
</body></html>
