<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TK 新号观察</title><link rel="stylesheet" href="board.css?v=20261030g"></head>
<body>
<header><div><h1>TK 新号观察</h1><div class="status" id="status">正在读取数据…</div></div><button id="refresh">刷新</button></header>
<main>
  <div id="error" class="notice warning" role="alert"></div>
  <section id="focusSix" class="focus-six" aria-labelledby="focusSixTitle" hidden>
    <div class="focus-six-head"><div><h2 id="focusSixTitle">#6 投流观察</h2><p id="focusSixStatus" class="muted"></p></div><div class="focus-six-followers"><small>粉丝量</small><strong id="focusSixFollowers">—</strong><small id="focusSixFollowersAt"></small></div></div>
    <div id="focusSixVideos" class="focus-six-videos"></div>
  </section>
  <details class="qr-library">
    <summary><strong>连接二维码（8 张）</strong><span>先看原有 5 张，再看新增 3 张</span></summary>
    <div class="qr-gallery">
      <figure><img src="data/qr/1.svg" alt="香港A9连接二维码" width="420" height="420" loading="lazy"><figcaption><b>01 香港A9</b></figcaption><a href="data/qr/1.svg" target="_blank" rel="noopener">打开大图</a></figure>
      <figure><img src="data/qr/2.svg" alt="日本A9连接二维码" width="420" height="420" loading="lazy"><figcaption><b>02 日本A9</b></figcaption><a href="data/qr/2.svg" target="_blank" rel="noopener">打开大图</a></figure>
      <figure><img src="data/qr/3.svg" alt="香港A10连接二维码" width="420" height="420" loading="lazy"><figcaption><b>03 香港A10</b></figcaption><a href="data/qr/3.svg" target="_blank" rel="noopener">打开大图</a></figure>
      <figure><img src="data/qr/4.svg" alt="日本A10连接二维码" width="420" height="420" loading="lazy"><figcaption><b>04 日本A10</b></figcaption><a href="data/qr/4.svg" target="_blank" rel="noopener">打开大图</a></figure>
      <figure><img src="data/qr/5.svg" alt="美国A1连接二维码" width="420" height="420" loading="lazy"><figcaption><b>05 美国A1</b></figcaption><a href="data/qr/5.svg" target="_blank" rel="noopener">打开大图</a></figure>
      <figure><img src="data/qr/6.svg" alt="香港W02连接二维码" width="420" height="420" loading="lazy"><figcaption><b>06 香港W02</b></figcaption><a href="data/qr/6.svg" target="_blank" rel="noopener">打开大图</a></figure>
      <figure><img src="data/qr/7.svg" alt="日本W07第一张连接二维码" width="420" height="420" loading="lazy"><figcaption><b>07 日本W07</b><small>第 1 张</small></figcaption><a href="data/qr/7.svg" target="_blank" rel="noopener">打开大图</a></figure>
      <figure><img src="data/qr/8.svg" alt="日本W07第二张连接二维码" width="420" height="420" loading="lazy"><figcaption><b>08 日本W07</b><small>第 2 张</small></figcaption><a href="data/qr/8.svg" target="_blank" rel="noopener">打开大图</a></figure>
    </div>
  </details>
  <section id="trial" aria-labelledby="trialTitle"><h2 id="trialTitle">新号试跑</h2>
    <p class="muted">按批次展开，再按手机序号查看；空序号保留。采集失败不算零播放，也不代表封号。</p>
    <div class="trial-tabs" role="tablist" aria-label="账号阶段">
      <button class="trial-tab active" type="button" role="tab" aria-selected="true" data-trial-tab="new">新号区 <span id="newCount"></span></button>
      <button class="trial-tab" type="button" role="tab" aria-selected="false" data-trial-tab="promoted">入围号 <span id="promotedCount"></span></button>
    </div>
    <label class="trial-search-label" for="trialSearch">查找手机或账号</label>
    <input id="trialSearch" class="trial-search" type="search" placeholder="例如 8 或 @账号" autocomplete="off">
    <div id="trialMessage" class="notice" role="status" hidden></div>
    <div id="trialToast" class="trial-toast" role="status" hidden></div>
    <div id="trialContent"></div>
    <button id="trialMore" class="trial-more" type="button" hidden>显示更多账号</button>
    <details class="trial-eliminated"><summary id="trialHistoryTitle">淘汰记录</summary><div id="trialHistory"></div></details>
  </section>
  <dialog id="eliminateDialog" class="eliminate-dialog" aria-labelledby="eliminateTitle" aria-describedby="eliminateHint">
    <h2 id="eliminateTitle">淘汰账号</h2>
    <p id="eliminateHint">请选择淘汰原因。采集不到不代表封号；“被封禁”只在你确认后记录。</p>
    <fieldset class="eliminate-reasons"><legend>淘汰原因</legend>
      <label><input type="radio" name="eliminateReason" value="low_views"><span>播放低</span></label>
      <label><input type="radio" name="eliminateReason" value="banned"><span>已确认封禁</span></label>
      <label><input type="radio" name="eliminateReason" value="other"><span>其他原因</span></label>
    </fieldset>
    <p id="eliminateError" class="error" role="alert" hidden></p>
    <div class="eliminate-actions"><button type="button" id="cancelElimination">取消，继续观察</button><button type="button" id="confirmElimination" disabled>确认淘汰并停采</button></div>
  </dialog>
</main><script src="public.js?v=20261030g"></script><script src="node-peek.js?v=20261030d"></script>
</body></html>
